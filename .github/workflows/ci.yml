# Каждый пуш и пулл-реквест: сборка на Linux и Windows + все тесты.
# На Windows ещё и собирается архив с игрой — его можно скачать во вкладке Actions.
name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Зависимости raylib
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Сборка
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Тесты
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Сборка
        run: |
          cmake -S . -B build
          cmake --build build --config Release

      - name: Тесты
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Архив с игрой
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/pixel_to_people.exe dist/
          Copy-Item -Recurse assets dist/assets

      - uses: actions/upload-artifact@v4
        with:
          name: pixel-to-people-windows
          path: dist
