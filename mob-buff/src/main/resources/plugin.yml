name: MobBuff
version: '1.0.0'
main: dev.ourgame.mobbuff.MobBuffPlugin
api-version: '26.2'
description: Makes hostile mobs a bit stronger: more health and damage, longer aggro range, longer and faster melee attacks
authors: [Claude]
commands:
  mobbuff:
    description: MobBuff status and reload
    usage: /<command> [reload]
    permission: mobbuff.admin
permissions:
  mobbuff.admin:
    description: Allows /mobbuff
    default: op
