# MobBuff: усиление враждебных мобов (зомби, скелеты, пауки, криперы, эндермены и т.д.).
# Мирные мобы, железные големы, жители и боссы (Иссушитель, Дракон) не затрагиваются.
# После изменения: /mobbuff reload (применится и к уже живущим мобам).

enabled: true            # false: снять усиление со всех мобов (при их загрузке)

health-multiplier: 1.5           # здоровье: 1.5 = +50%
damage-multiplier: 1.25          # урон в ближнем бою: 1.25 = +25%
follow-range-multiplier: 1.25    # с какого расстояния моб замечает и преследует игрока: +25%

# Ближний бой (зомби, пауки, эндермены, поборники, пиглины с мечом, чешуйницы и т.п.):
extra-melee-reach: 0.5           # насколько дальше бьёт моб, в блоках (в обычной игре около 0,8 от края моба)
attack-interval-ticks: 16        # пауза между ударами в тиках (20 тиков = 1 с; в обычной игре 20)

include-bosses: false            # true: усиливать и Иссушителя с Драконом
debug: false                     # писать в консоль каждый удар моба (для проверки)
