# ClaudeBridge: HTTP API для удалённого администрирования сервера и игровой аватар ИИ.
# Подробности и безопасная настройка: README.md в репозитории плагина.

http:
  # Адрес, на котором слушает API.
  #  - 127.0.0.1: веб-сервер (Caddy/nginx) стоит на той же машине (VPS);
  #  - 0.0.0.0: игровой хостинг; тогда обязательно включите tls и allowed-ips ниже.
  bind: 127.0.0.1
  # На игровом хостинге: дополнительный порт, выделенный панелью хостинга.
  port: 8765
  tls:
    # Встроенный HTTPS с самоподписанным сертификатом (создаётся автоматически).
    # Сертификат для веб-сервера: plugins/ClaudeBridge/tls-cert.pem. Имя для проверки: claudebridge.local
    enabled: false
    # Дополнительные имена или IP в сертификате (claudebridge.local, localhost и 127.0.0.1 есть всегда).
    hosts: []
  # Принимать запросы только с этих адресов (IP, подсеть CIDR или имя хоста). Пусто = с любых.
  # На игровом хостинге укажите IP вашего веб-сервера, например: ["203.0.113.10"]
  allowed-ips: []

auth:
  # Если пусто, токен хранится в plugins/ClaudeBridge/token.txt (создаётся автоматически при первом запуске).
  # Запросы должны содержать заголовок: Authorization: Bearer <токен>
  token: ""

# Какие возможности API включены.
features:
  console: true      # выполнение консольных команд
  files: true        # просмотр файлов сервера (только чтение)
  databases: true    # SELECT-запросы к базам (только чтение)
  avatar: true       # игровой аватар

files:
  # Корень доступа к файлам относительно папки сервера.
  root: "."
  # Максимум байт за один запрос чтения файла.
  max-read-bytes: 1048576
  # Пути (относительно root), которые нельзя читать, например: ["plugins/AuthMe"]
  deny: []

databases:
  max-rows: 500
  # Именованные подключения к MySQL/MariaDB. SQLite-файлы можно открывать по пути без настройки.
  # Рекомендуется пользователь БД только с правами SELECT.
  connections: {}
  #  luckperms:
  #    url: "jdbc:mysql://127.0.0.1:3306/luckperms"
  #    user: "readonly"
  #    password: "secret"

avatar:
  name: "Claude"
  # Подпись под именем.
  description: "AI"
  # Ник лицензионного игрока, чей скин использовать (пусто = стандартный скин).
  skin: ""
  # Дальность взаимодействия с блоками и сущностями.
  reach: 4.5
  # Скорость ходьбы, блоков в секунду (у игрока около 4.3).
  walk-speed: 4.3
  invulnerable: false
  keep-inventory: false
  # Сообщать в чат о входе и выходе аватара.
  announce: true
  # Возвращать аватара на прежнее место после перезапуска сервера.
  respawn-on-start: true

chat:
  buffer-size: 1000

# Журнал всех запросов к API: plugins/ClaudeBridge/audit.log
audit-log: true
