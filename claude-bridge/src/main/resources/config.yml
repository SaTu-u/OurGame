# ClaudeBridge: HTTP API для удалённого администрирования сервера и игровой аватар ИИ.
# Подробности и безопасная настройка: README.md в репозитории плагина.

http:
  # Адрес, на котором слушает API.
  #  - 127.0.0.1: к API обращаются только с этой же машины (например, через Caddy/nginx на ней же);
  #  - 0.0.0.0: API доступен из сети (игровой хостинг). Тогда обязательно включите tls ниже.
  bind: 127.0.0.1
  # Порт API. Для режима acme снаружи должен быть доступен порт 443 (на хостинге: выделенный порт 443).
  port: 8765
  tls:
    # off         - без шифрования (только вместе с bind: 127.0.0.1);
    # acme        - бесплатный доверенный сертификат Let's Encrypt для вашего домена, продлевается сам.
    #               Нужно: домен с A-записью на IP сервера, порт 443 снаружи ведёт на этот плагин;
    # self-signed - свой сертификат для веб-сервера, который его закрепляет (plugins/ClaudeBridge/tls-cert.pem);
    # files       - готовый сертификат и ключ в PEM-файлах (перечитываются при изменении).
    mode: off
    acme:
      # Домен, по которому доступен API, например: bridge.example.ru
      domain: ""
      # Почта для писем Let's Encrypt (необязательно).
      email: ""
      # Прочитайте соглашение Let's Encrypt (https://letsencrypt.org/repository/) и поставьте true.
      agree-tos: false
      # Для пробы без лимитов: https://acme-staging-v02.api.letsencrypt.org/directory (сертификат не будет доверенным)
      directory: "https://acme-v02.api.letsencrypt.org/directory"
    files:
      certificate: "plugins/ClaudeBridge/cert.pem"   # цепочка сертификатов (fullchain)
      private-key: "plugins/ClaudeBridge/key.pem"    # ключ PKCS#8 ("BEGIN PRIVATE KEY") или RSA
    # self-signed: дополнительные имена или IP в сертификате (claudebridge.local, localhost и 127.0.0.1 есть всегда).
    hosts: []
  # Принимать запросы только с этих адресов (IP, подсеть CIDR или имя хоста). Пусто = с любых.
  allowed-ips: []

auth:
  # Если пусто, токен хранится в plugins/ClaudeBridge/token.txt (создаётся автоматически при первом запуске).
  # Запросы должны содержать заголовок: Authorization: Bearer <токен>
  token: ""

# Какие возможности API включены.
features:
  console: true      # выполнение консольных команд
  files: true        # просмотр файлов сервера (только чтение)
  databases: true    # SELECT-запросы к базам (только чтение)
  avatar: true       # игровой аватар

files:
  # Корень доступа к файлам относительно папки сервера.
  root: "."
  # Максимум байт за один запрос чтения файла.
  max-read-bytes: 1048576
  # Пути (относительно root), которые нельзя читать, например: ["plugins/AuthMe"]
  deny: []

databases:
  max-rows: 500
  # Именованные подключения к MySQL/MariaDB. SQLite-файлы можно открывать по пути без настройки.
  # Рекомендуется пользователь БД только с правами SELECT.
  connections: {}
  #  luckperms:
  #    url: "jdbc:mysql://127.0.0.1:3306/luckperms"
  #    user: "readonly"
  #    password: "secret"

avatar:
  name: "Claude"
  # Подпись под именем.
  description: "AI"
  # Ник лицензионного игрока, чей скин использовать (пусто = стандартный скин).
  skin: ""
  # Дальность взаимодействия с блоками и сущностями.
  reach: 4.5
  # Скорость ходьбы, блоков в секунду (у игрока около 4.3).
  walk-speed: 4.3
  invulnerable: false
  keep-inventory: false
  # Сообщать в чат о входе и выходе аватара.
  announce: true
  # Возвращать аватара на прежнее место после перезапуска сервера.
  respawn-on-start: true

chat:
  buffer-size: 1000

# Журнал всех запросов к API: plugins/ClaudeBridge/audit.log
audit-log: true
