name: ClaudeBridge
version: '1.0.0'
main: dev.claudebridge.ClaudeBridgePlugin
api-version: '26.2'
description: HTTP API for remote server administration and an in-world AI avatar
authors: [Claude]
commands:
  claudebridge:
    description: Manage ClaudeBridge (status, on, off, token, reload, despawn)
    usage: /<command> <status|on|off|token|reload|despawn>
    permission: claudebridge.admin
    aliases: [cbridge]
permissions:
  claudebridge.admin:
    description: Allows managing ClaudeBridge
    default: op
